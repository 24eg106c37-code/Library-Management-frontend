<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join Open Shelf</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">OS</span><span>Open Shelf<small>COMMUNITY LIBRARY</small></span></a><main class="auth-layout"><section class="auth-art"><p class="eyebrow">A LIBRARY CARD, WITHOUT THE WAIT</p><h1>Make room<br><em>for a new story.</em></h1><p>Create your account to browse, borrow, and keep track of the books that find you.</p></section><section class="auth-form-wrap"><form id="register-form" class="form-panel"><span class="eyebrow">BECOME A MEMBER</span><h2>Join the library</h2><label>Your name<input name="name" autocomplete="name" required maxlength="120"></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Phone <span class="optional">(optional)</span><input name="phone" type="tel" autocomplete="tel"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required><small>Use at least 8 characters.</small></label><p class="form-message" role="alert"></p><button class="button button-dark full-width" type="submit">Create account <span aria-hidden="true">→</span></button><p class="form-foot">Already a member? <a href="login.html">Sign in</a></p></form></section></main><script src="js/api.js"></script><script src="js/register.js"></script></body></html>
