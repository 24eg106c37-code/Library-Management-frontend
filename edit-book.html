<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit a book | Open Shelf</title><link rel="stylesheet" href="css/style.css"></head><body class="app-page"><header class="app-header"><a class="brand" href="admin-dashboard.html"><span class="brand-mark">OS</span><span>Open Shelf<small>LIBRARY DESK</small></span></a><nav><a href="admin-dashboard.html">Overview</a><a class="active" href="books.html">Books</a><a href="transactions.html">Transactions</a><button class="nav-user" id="sign-out">Sign out ↗</button></nav></header><main class="app-main narrow-main"><p class="eyebrow">LIBRARY DESK / CATALOG</p><h1>Update a title.</h1><p class="muted">Issued copies are kept in the collection total and remain unavailable.</p><form id="book-form" class="data-form"><label>Title<input name="title" required maxlength="180"></label><label>Author<input name="author" required maxlength="140"></label><div class="form-row"><label>Category<input name="category" required maxlength="100"></label><label>ISBN<input name="isbn" required maxlength="30"></label></div><div class="form-row"><label>Publisher<input name="publisher" maxlength="140"></label><label>Publication year<input name="publicationYear" type="number" min="1400" max="2100"></label></div><label>Total copies<input name="quantity" type="number" min="1" max="10000" required></label><p id="availability-hint" class="muted"></p><p class="form-message" role="alert"></p><div class="form-actions"><a class="button button-quiet" href="books.html">Cancel</a><button class="button button-dark" type="submit">Save changes <span aria-hidden="true">→</span></button></div></form></main><script src="js/api.js"></script><script src="js/books-form.js"></script></body></html>
